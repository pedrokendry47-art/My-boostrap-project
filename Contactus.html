<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Us | My Photography</title>
<link rel="stylesheet" href="Contactus.css">
</head>
<section class="contact-hero">
    <h1>Get In Touch</h1>
    <p class="tagline">Let's start planning your gallery</p>
    <div class="contact-divider"></div>
  </section>

  <section class="contact-wrap">

    <div class="contact-info">
      <h2>Contact Details</h2>
      <div class="contact-item">
        <strong>Email</strong>
        pedrophotography@gmail.com
      </div>
      <div class="contact-item">
        <strong>Phone</strong>
        +234 909 143 4420
      </div>
      <div class="contact-item">
        <strong>Studio Location</strong>
        Paris, France — by appointment only
      </div>
      <div class="contact-item">
        <strong>Response Time</strong>
        We typically reply within 24-48 hours.
      </div>
    </div>

    <div class="contact-form">
      <form id="contact-form">
        <label for="name">Full Name</label>
        <input type="text" id="name" required>

        <label for="email">Email Address</label>
        <input type="email" id="email" required>

        <label for="service">Service Interested In</label>
        <select id="service">
          <option>Wedding Day Coverage</option>
          <option>Engagement Session</option>
          <option>Portrait Session</option>
          <option>Wedding Film</option>
          <option>Wedding Album</option>
          <option>Custom Package</option>
        </select>

        <label for="service">Event Date (if known)</label>
        <input type="service" id="service" required>

        <label for="message">Your Message</label>
        <textarea id="message" required placeholder="Any special information..."></textarea>

        <button type="submit">Send Message</button>
        <div class="form-success" id="form-success">Thank you! Your message has been received — we'll be in touch soon.</div>
      </form>
    </div>
</body>
</html>
